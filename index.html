<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f8f7f4" />
  <title>Architecture &amp; Backend Field Guide</title>
  <meta name="description" content="A self-paced guide to software architecture and system design: learning paths, hands-on tutorials, a searchable glossary and a reference library." />
  <link rel="stylesheet" href="styles.css" />
  <script>
    // Set the palette before first paint so there is no flash of the wrong theme.
    (function () {
      var theme = "light";
      try {
        var saved = localStorage.getItem("fieldguide-theme");
        if (saved === "dark" || saved === "light") {
          theme = saved;
        } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
          theme = "dark";
        }
      } catch (e) { /* storage blocked: fall back to light */ }
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true">A</span>
        <span class="brand-text">
          <span class="brand-name">Architecture Field Guide</span>
          <span class="brand-sub">System design in practice</span>
        </span>
      </a>
      <nav class="site-nav" aria-label="Sections">
        <a href="#/" data-nav="library">Library</a>
        <a href="#/paths" data-nav="paths">Paths</a>
        <a href="#/tutorials" data-nav="tutorials">Tutorials</a>
        <a href="#/glossary" data-nav="glossary">Glossary</a>
        <a href="#/cards" data-nav="cards">Cards</a>
      </nav>
      <form class="quickfind" id="quickfind" role="search">
        <input type="search" placeholder="Search everything… ( / )" aria-label="Search everything" autocomplete="off" />
      </form>
      <p class="overall" id="overall" aria-live="polite"></p>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark theme" aria-pressed="false" title="Switch to dark theme">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
      </button>
    </div>
  </header>

  <main class="wrap" id="view">
    <p class="loading">Loading…</p>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>Reference modules are extracted from the PDFs in this folder. Tutorials, paths and the glossary are original to this guide. Progress and answers are saved in this browser only.</p>
    </div>
  </footer>

  <script src="data.js"></script>
  <script src="modules/catalog.js"></script>
  <script src="modules/figures.js"></script>
  <script src="curriculum.js"></script>
  <script src="glossary.js"></script>
  <script src="tutorials-core.js"></script>
  <script src="tutorials-data.js"></script>
  <script src="tutorials-systems.js"></script>
  <script src="theme.js"></script>
  <script src="app.js"></script>
</body>
</html>
